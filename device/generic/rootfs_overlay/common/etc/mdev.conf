# Baseline copiado de busybox/mdev.conf + regra de hotplug do SD.
# O S99user habilita mdev como handler de hotplug (echo /sbin/mdev >
# /proc/sys/kernel/hotplug), então inserir/remover o SD dispara as regras
# abaixo em runtime.

# null may already exist; therefore ownership has to be changed with command
null		root:root 666 @chmod 666 $MDEV
zero		root:root 666
full		root:root 666
random		root:root 444
urandom		root:root 444
hwrandom	root:root 444
grsec		root:root 660

kmem		root:root 640
mem		root:root 640
port		root:root 640
# console may already exist; therefore ownership has to be changed with command
console		root:tty 600 @chmod 600 $MDEV
ptmx		root:tty 666
pty.*		root:tty 660

# Typical devices
tty		root:tty 666
tty[0-9]*	root:tty 660
vcsa*[0-9]*	root:tty 660
ttyS[0-9]*	root:root 660
ttyUSB[0-9]*	root:root 660

# alsa sound devices
snd/pcm.*	root:audio 660
snd/control.*	root:audio 660
snd/midi.*	root:audio 660
snd/seq		root:audio 660
snd/timer	root:audio 660

# input stuff
input/event[0-9]+	root:root 640
input/mice		root:root 640
input/mouse[0-9]	root:root 640
input/ts[0-9]		root:root 600

# SD card hotplug: monta em /mnt/sd quando inserido, desmonta ao remover.
# `*` = executa em ambos add/remove; $ACTION é repassado ao script.
# Intencionalmente restrito a mmcblk1p1 (SD) pra não mexer com mmcblk0 (eMMC).
mmcblk1p1	0:0 0660 */etc/init.d/S40mountsd $ACTION

# load modules
$MODALIAS=.*	root:root 660 @modprobe "$MODALIAS"
