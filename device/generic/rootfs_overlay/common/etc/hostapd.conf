# TEMPLATE — wifi-lib.sh gera /tmp/hostapd.runtime.conf substituindo:
#   - ssid=           (vira <PREFIX>-<MAC suffix>, ver AP_SSID_PREFIX)
#   - hw_mode=        (g=2.4GHz, a=5GHz, conforme AP_BAND)
#   - channel=        (conforme AP_CHANNEL; default 6 em 2.4G, 36 em 5G)
#   - ieee80211d=     (1 quando country_code definido, 0 caso contrário)
#   - ieee80211h=     (1 em canais DFS 5G, 0 caso contrário)
#   - wpa_passphrase= (se AP_PASSPHRASE setado)
#   - country_code=   (lido de /mnt/data/wifi-country; omitido se 00/ausente)
# Para customizar sem rebuildar a imagem, crie /mnt/data/wifi.conf com:
#   AP_SSID_PREFIX=MeuDuo
#   AP_PASSPHRASE=novasenha
#   AP_BAND=5g
#   AP_CHANNEL=149
# Em runtime CLI sobrepõe arquivo: 'wifi-ap 5g 36 BR'.
# country_code= não está aqui de propósito: é injetado em runtime conforme
# /mnt/data/wifi-country pra não divergir do `iw reg set` do duo-init.sh.
interface=wlan0
driver=nl80211
# Socket de controle pra hostapd_cli (lista estações associadas, etc.).
# O aic8800 SDIO não publica stations via nl80211, então essa é a unica
# forma confiável de listar quem está conectado.
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
ssid=DuoS-AP
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP
wpa_passphrase=milkvduos
